# Milestone 17: Nginx reverse proxy gateway.
# One public service receives browser traffic, then forwards requests to
# private Compose service names on the Docker network.

server {
  # Listen inside the proxy container on port 8080.
  listen 8080;
  server_name _;

  # A tiny endpoint for the proxy container health check.
  location = /health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "healthy\n";
  }

  # Browser API calls use /api, but the backend app itself still exposes
  # routes like /health and /deployments.
  location /api/ {
    rewrite ^/api/?(.*)$ /$1 break;
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /api {
    proxy_pass http://backend:8080/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Everything else is the React frontend served by the frontend container.
  location / {
    proxy_pass http://frontend:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
