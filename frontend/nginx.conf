# Milestone 12: runtime frontend serves the built Vite assets with Nginx.

# Define one Nginx website/server rule for this container.
server {
  # Listen inside the frontend container on port 8080.
  # Compose maps your laptop's localhost:3000 to this container port.
  listen 8080;

  # Match any hostname, which is enough for local Docker learning.
  server_name _;

  # Serve files from this folder inside the container.
  # The Dockerfile copies Vite's built dist/ files into this folder.
  root /usr/share/nginx/html;

  # When the browser asks for "/", return index.html from the root folder.
  index index.html;

  # Apply this rule to every browser request path.
  location / {
    # First try the exact requested file, then a folder, then fall back to
    # index.html so React can handle frontend routes.
    try_files $uri $uri/ /index.html;
  }
}
